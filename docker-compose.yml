services:
  db:
    image: postgres:15-alpine
    container_name: klubly-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: klubly-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - APP_JWT_SECRET=${JWT_SECRET}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop # Recrea todo al iniciar y borra al cerrar
      - APP_DEFAULT_PASSWORD=${APP_DEFAULT_PASSWORD}
    
  frontend:
    build: ./frontend
    container_name: klubly-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  adminer:
    image: adminer
    container_name: klubly-adminer
    restart: always
    ports:
      - "8888:8080"

volumes:
  pgdata:
